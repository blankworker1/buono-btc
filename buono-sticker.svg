<title id="t">BUONO</title>
<desc id="d">A round sticker on a dark green circle: a lightning bolt or city name at the top, the word BUONO in the middle, and the words accepted here below. The B is the Bitcoin symbol in an orange circle. The first O is a filled red token with a gold ring; the second O is an empty dashed ring.</desc>
